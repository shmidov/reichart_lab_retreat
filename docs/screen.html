<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מסך תצוגה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="screen">
  <div class="stage">
    <header class="stage-top">
      <div class="brand"><span class="brand-mark"></span><span data-game-title></span></div>
      <div class="screen-status">
        <span id="conn"></span>
        <span id="role"></span>
        <button class="link" id="takeover" type="button" hidden>להפוך למסך הראשי</button>
        <span class="live off" id="live">מתחבר…</span>
      </div>
    </header>
    <div class="stage-body" id="body">
      <div class="center"><div class="breath"></div></div>
    </div>
  </div>
  <div class="corner-qr" id="corner-qr" hidden>
    <div class="qr-box" id="corner-qr-code"></div>
    <div>להצטרפות</div>
  </div>

  <script src="config.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/relay.js"></script>
  <script src="assets/game-server.js"></script>
  <script>
    // This page is the game's "server": the first projector screen to open runs the game in memory.
    // Any other copy of this page just mirrors it (and can take over, e.g. if the projector laptop changes).
    const $ = id => document.getElementById(id);
    const body = $('body');
    const joinUrl = playerUrl();

    // Per tab (survives reloads, but a second tab is a different screen). The game memory itself is per browser.
    let serverId = null;
    try { serverId = sessionStorage.getItem('serverId'); } catch (err) { /* storage blocked */ }
    if (!serverId) {
      serverId = randomId();
      try { sessionStorage.setItem('serverId', serverId); } catch (err) { /* storage blocked */ }
    }

    let mode = 'starting'; // 'server' | 'viewer'
    let server = null;
    let state = null;
    let lastState = null; // latest state seen on the relay (to adopt on takeover)
    let lastHost = null;
    let heartbeat = null; // latest heartbeat seen from any server
    let heartbeatAt = 0;

    const relay = new Relay((connected, total) => {
      $('conn').textContent = connected ? '' : 'אין חיבור, מנסה שוב…';
      $('conn').className = connected ? '' : 'status error';
      $('live').textContent = connected ? 'מחובר' : 'מתחבר…';
      $('live').className = 'live' + (connected ? '' : ' off');
    });

    let otherBeats = 0; // live heartbeats from another screen since this page loaded

    relay.subscribe('server', hb => {
      heartbeat = hb;
      heartbeatAt = Date.now();
      if (hb.serverId !== serverId) otherBeats++;
      // Someone took over with a newer claim: step down.
      if (mode === 'server' && hb.serverId !== serverId && hb.epoch > server.g.epoch) becomeViewer();
    });
    relay.subscribe('state', s => {
      if (isNewerState(s, lastState)) lastState = s;
      if (mode === 'viewer' && isNewerState(s, state)) { state = s; render(); }
    });
    relay.subscribe('host', h => {
      if (isNewerState(h, lastHost)) lastHost = h;
    });

    renderQr($('corner-qr-code'), joinUrl, 110);

    (async function start() {
      await relay.whenConnected(15000);
      await new Promise(r => setTimeout(r, 2500)); // collect retained heartbeat/state
      const otherAlive = heartbeat && heartbeat.serverId !== serverId && Date.now() - heartbeat.t < SERVER_ALIVE_MS + 5000;
      if (otherAlive) becomeViewer();
      else becomeServer(false);
    })();

    function nextEpoch() {
      const seen = Math.max(lastState ? lastState.epoch : 0, heartbeat ? heartbeat.epoch : 0);
      return Math.max(Date.now(), seen + 1);
    }

    function becomeServer(takeover) {
      mode = 'server';
      server = new GameServer(relay, serverId, nextEpoch(), (s) => { state = s; render(); });
      // Continue from what was last published, unless this browser's own memory is that same (or a later) game.
      if (lastState && (takeover || lastState.epoch > server.savedEpoch)) {
        server.adopt(lastState, lastHost);
      }
      server.start();
      $('role').textContent = '';
      $('takeover').hidden = true;
    }

    function becomeViewer() {
      if (server) { server.stop(); server = null; }
      mode = 'viewer';
      $('role').textContent = 'מסך משני';
      $('takeover').hidden = false;
      if (lastState) { state = lastState; render(); }
    }

    $('takeover').addEventListener('click', () => {
      if (confirm('להעביר את המשחק למסך הזה? (תשובות שעוד לא נסגרו בשאלה הפתוחה יאבדו)')) becomeServer(true);
    });

    // The "other screen" only ever sent its last (retained) heartbeat: it's gone, so take over automatically.
    // If a live main screen disappears, only offer the takeover button (it may just be reconnecting).
    setInterval(() => {
      if (mode !== 'viewer' || Date.now() - heartbeatAt < SERVER_ALIVE_MS) return;
      if (otherBeats <= 1) becomeServer(false);
      else $('role').textContent = 'המסך הראשי לא מחובר';
    }, 2000);

    // ---------- rendering ----------

    let renderedKey = null;

    function render() {
      if (!state) return;
      const s = state;
      // Only rebuild the page when something visible changed (answers only update the counter).
      const key = [s.epoch, s.activity, s.phase, s.round, s.index, s.total, s.results ? s.results.total : -1].join('|');
      if (key !== renderedKey) {
        renderedKey = key;
        build(s);
      }
      document.querySelectorAll('[data-count=players]').forEach(n => { n.textContent = s.playerCount; });
      document.querySelectorAll('[data-count=answered]').forEach(n => { n.textContent = s.answeredCount; });
    }

    function scene(...children) {
      setChildren(body, el('div', { class: 'scene' }, children));
    }

    /** The site's QR code inside the slate join panel (used by the welcome screen and the game lobby). */
    function joinPanel(caption) {
      const qr = el('div', { class: 'qr-box' });
      const panel = el('div', { class: 'join-panel' },
        el('div', { class: 'join-title' }, caption),
        qr,
        el('div', { class: 'join-url' }, joinUrl));
      // Render after the panel is in the page.
      setTimeout(() => renderQr(qr, joinUrl, Math.round(Math.min(window.innerWidth * 0.26, window.innerHeight * 0.46))));
      return panel;
    }

    function build(s) {
      const activity = activityById(s.activity);
      $('corner-qr').hidden = !(activity && activity.type === 'game' && s.phase === 'open');

      if (!activity) return buildWelcome();
      if (activity.type === 'writing') return buildWriting(activity);
      return buildGame(s, activity);
    }

    function buildWelcome() {
      scene(el('div', { class: 'lobby' },
        el('div', {},
          el('h1', {}, WELCOME.title),
          WELCOME.subtitle ? el('p', { class: 'lead' }, WELCOME.subtitle) : null),
        joinPanel('סרקו כדי להיכנס')));
    }

    function buildWriting(activity) {
      scene(
        el('div', { class: 'eyebrow' }, activity.name),
        el('p', { class: 's-question' }, activity.title),
        activity.explanation ? el('p', { class: 'explanation writing-text' }, activity.explanation) : null);
    }

    function buildGame(s, activity) {
      const gameTitle = activity.title || GAME_TITLE;

      if (s.phase === 'open' && s.question) {
        scene(
          el('div', { class: 'eyebrow' }, 'מה דעתכם?'),
          el('div', { class: 'counter' }, questionCounter(s)),
          el('p', { class: 's-question' }, s.question.text),
          s.question.explanation ? el('p', { class: 'explanation' }, s.question.explanation) : null,
          optionsPreview(s.question),
          el('div', { class: 'meter' },
            el('span', { class: 'big', 'data-count': 'answered' }),
            el('span', {}, 'מתוך'),
            el('span', { 'data-count': 'players' }),
            el('span', {}, 'שיתפו את דעתם')));
        return;
      }

      if (s.phase === 'results' && s.question && s.results) {
        const chart = el('div');
        scene(
          el('div', { class: 'eyebrow' }, 'בואו נראה מה חשבנו'),
          el('div', { class: 'counter' }, questionCounter(s)),
          el('p', { class: 's-question compact' }, s.question.text),
          s.question.explanation ? el('p', { class: 'explanation' }, s.question.explanation) : null,
          chart,
          el('div', { class: 'meter small', style: 'margin-top:2.5vh' },
            el('span', { class: 'big' }, s.results.total),
            el('span', {}, 'תשובות'),
            el('span', { class: 'discuss', style: 'margin:0 1.2em 0 0' }, 'מה אפשר ללמוד מהתוצאות?')));
        renderBars(chart, s.results, s.question);
        return;
      }

      if (s.phase === 'end') {
        scene(el('div', { class: 'finale' },
          el('div', { class: 'breath still' }),
          el('h1', {}, 'תודה רבה!'),
          el('p', { class: 'muted' }, gameTitle)));
        return;
      }

      // Lobby
      scene(el('div', { class: 'lobby' },
        el('div', {},
          el('div', { class: 'eyebrow' }, activity.name),
          el('h1', {}, gameTitle),
          el('p', { class: 'lead' }, 'סרקו את הקוד, הזינו את השם שלכם וחכו לשאלה הראשונה.'),
          el('div', { class: 'meter' },
            el('span', { class: 'big', 'data-count': 'players' }),
            el('span', {}, 'משתתפים הצטרפו'))),
        joinPanel('סרקו כדי להצטרף')));
    }
  </script>
</body>
</html>
