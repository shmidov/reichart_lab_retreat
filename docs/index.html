<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="appbar">
      <div class="brand"><span class="brand-mark"></span><span data-game-title></span></div>
      <span class="live off" id="live">מתחבר…</span>
    </header>

    <section id="join" class="card enter" hidden>
      <div class="eyebrow">הצטרפות</div>
      <h1>ברוכים הבאים</h1>
      <p class="muted">רק שם, בלי סיסמה.</p>
      <form id="join-form">
        <label>איך קוראים לך?
          <input type="text" id="name-input" maxlength="40" autocomplete="name" required>
        </label>
        <button class="primary big" type="submit">הצטרפות</button>
      </form>
    </section>

    <section id="game" hidden>
      <div id="view" class="card"></div>
      <div class="who">משתתף/ת בתור <b id="me"></b> · <button class="link" id="rename" type="button">החלפת שם</button></div>
    </section>

    <p id="status" class="status"></p>
  </main>

  <script src="config.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/relay.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const view = $('view');
    const SAVED_NOTE = 'נשמר ✓ אפשר לשנות עד שהשאלה נסגרת';

    let playerId = storage.get('playerId');
    if (!playerId) { playerId = randomId(); storage.set('playerId', playerId); }
    let name = storage.get('name');
    let state = null;

    const relay = new Relay(connected => {
      $('live').textContent = connected ? 'LIVE' : 'מתחבר…';
      $('live').className = 'live' + (connected ? '' : ' off');
      if (connected && name) sendJoin(); // (re)announce ourselves after every reconnect
    });

    relay.subscribe('state', s => {
      if (!isNewerState(s, state)) return;
      const changed = !state || s.phase !== state.phase || s.round !== state.round || s.epoch !== state.epoch;
      state = s;
      if (changed) render();
    });

    // Acknowledgements for this player only.
    relay.subscribe('p/' + playerId, msg => {
      if (msg.type === 'welcome') {
        // The server remembers our answer (e.g. after a reload or on another tab).
        if (msg.answer && state && msg.round === state.round) {
          storage.set(answerKey(msg.round), msg.answer);
          if (state.phase === 'open') { markSelected(msg.answer); setNote(SAVED_NOTE, 'ok'); }
        }
        return;
      }
      if (!pending || msg.round !== pending.round || msg.answer !== pending.answer) return;
      clearTimeout(pending.timer);
      pending = null;
      if (msg.type === 'ack') {
        setNote(SAVED_NOTE, 'ok');
      } else {
        storage.remove(answerKey(msg.round));
        markSelected(null);
        setNote(msg.error || 'השמירה נכשלה', 'error');
      }
    });

    // ---------- joining ----------

    function sendJoin() {
      relay.publish('in', { type: 'join', id: playerId, name });
    }
    setInterval(() => { if (name) sendJoin(); }, 20000); // presence, so a restarted screen re-learns everyone

    function showJoin() {
      $('game').hidden = true;
      $('join').hidden = false;
      $('name-input').value = name || '';
      $('name-input').focus();
    }

    function enterGame() {
      $('me').textContent = name;
      $('join').hidden = true;
      $('game').hidden = false;
      sendJoin();
      render();
    }

    $('join-form').addEventListener('submit', e => {
      e.preventDefault();
      const value = $('name-input').value.trim().replace(/\s+/g, ' ');
      if (!value) return;
      name = value;
      storage.set('name', name);
      enterGame();
    });

    $('rename').addEventListener('click', showJoin);

    // ---------- answering ----------

    const answerKey = round => 'answer:' + round + ':' + (state && state.question ? state.question.id : '');
    let pending = null; // {round, answer, tries, timer}: waiting for the screen to acknowledge

    function choose(answer) {
      const round = state.round;
      storage.set(answerKey(round), answer);
      markSelected(answer);
      if (pending) clearTimeout(pending.timer);
      pending = { round, answer, tries: 0 };
      sendAnswer();
    }

    function sendAnswer() {
      if (!pending) return;
      if (pending.tries >= 6) {
        setNote('המסך הראשי לא עונה. נסו לבחור שוב.', 'error');
        pending = null;
        return;
      }
      pending.tries++;
      setNote('שומר…');
      relay.publish('in', { type: 'answer', id: playerId, name, round: pending.round, answer: pending.answer });
      pending.timer = setTimeout(sendAnswer, 2500);
    }

    function markSelected(answer) {
      view.querySelectorAll('.option').forEach(b => {
        b.classList.toggle('selected', b.dataset.value === answer);
        b.setAttribute('aria-pressed', b.dataset.value === answer ? 'true' : 'false');
      });
    }

    function setNote(text, kind) {
      const note = view.querySelector('.note');
      if (!note) return;
      note.textContent = text;
      note.className = 'note' + (kind ? ' ' + kind : '');
    }

    // ---------- rendering ----------

    function show(...children) {
      setChildren(view, ...children);
      view.classList.remove('enter');
      void view.offsetWidth; // restart the entrance animation
      view.classList.add('enter');
    }

    function render() {
      if ($('game').hidden) return;
      const s = state;
      if (pending && (!s || s.phase !== 'open' || s.round !== pending.round)) {
        clearTimeout(pending.timer);
        pending = null;
      }

      if (s && s.phase === 'open' && s.question) return renderQuestion(s);

      if (s && s.phase === 'results' && s.question) {
        const mine = storage.get(answerKey(s.round));
        show(
          el('div', { class: 'counter' }, questionCounter(s)),
          el('h2', { class: 'q-title' }, s.question.text),
          el('div', { class: 'center', style: 'margin-top:26px' },
            el('div', { class: 'icon-badge' }, icon('lock')),
            el('p', {}, 'התשובות ננעלו. התוצאות על המסך הגדול.'),
            el('p', { class: 'muted' }, mine ? 'ענית: ' + mine : 'לא ענית על השאלה הזו.')));
        return;
      }

      if (s && s.phase === 'end') {
        show(el('div', { class: 'center' },
          el('div', { class: 'orb calm' }),
          el('h2', {}, 'תודה שהשתתפתם!')));
        return;
      }

      show(el('div', { class: 'center' },
        el('div', { class: 'orb' }),
        el('h2', {}, 'היי ' + name),
        el('p', { class: 'muted' }, el('span', { class: 'dots' }, 'מחכים לשאלה הבאה'))));
    }

    function renderQuestion(s) {
      const q = s.question;
      const selected = storage.get(answerKey(s.round));
      const colors = answerColors(q);
      const layout = q.type === 'scale' ? 'scale' : (q.options.length === 2 ? 'two' : '');
      show(
        el('div', { class: 'counter' }, questionCounter(s)),
        el('h2', { class: 'q-title' }, q.text),
        q.explanation ? el('p', { class: 'explanation' }, q.explanation) : null,
        el('div', { class: 'options ' + layout, role: 'group' },
          q.options.map((opt, i) => el('button', {
            type: 'button',
            class: 'option' + (opt === selected ? ' selected' : ''),
            style: '--c:' + colors[i],
            'data-value': opt,
            'aria-pressed': opt === selected ? 'true' : 'false',
            onclick: () => choose(opt),
          }, opt))),
        el('div', { class: 'note' + (selected ? ' ok' : '') }, selected ? SAVED_NOTE : 'בחרו תשובה'));
    }

    // ---------- start ----------

    if (name) enterGame();
    else showJoin();
  </script>
</body>
</html>
