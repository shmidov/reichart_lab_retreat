<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="appbar">
      <div class="brand"><img class="logo-sm" src="assets/logo.svg" alt="Reichart Group Retreat"></div>
      <span class="live off" id="live">Connecting…</span>
    </header>

    <section id="join" class="card enter" hidden>
      <div class="eyebrow" id="join-eyebrow">Join</div>
      <h1>What's your name?</h1>
      <p class="muted">Just a name, no password.</p>
      <form id="join-form">
        <label>Your name
          <input type="text" id="name-input" dir="auto" maxlength="40" autocomplete="name" required>
        </label>
        <button class="primary big" type="submit">Join</button>
      </form>
    </section>

    <section id="main">
      <div id="view" class="card"></div>
      <div class="who" id="who" hidden>Playing as <b id="me" dir="auto"></b> · <button class="link" id="rename" type="button">Change name</button></div>
    </section>

    <p id="status" class="status"></p>
  </main>

  <script src="config.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/relay.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const view = $('view');
    const SAVED_NOTE = 'Saved ✓ You can change it until the question closes.';

    let playerId = storage.get('playerId');
    if (!playerId) { playerId = randomId(); storage.set('playerId', playerId); }
    let name = storage.get('name');
    let state = null;

    const relay = new Relay(connected => {
      $('live').textContent = connected ? 'Connected' : 'Connecting…';
      $('live').className = 'live' + (connected ? '' : ' off');
      if (connected && name) sendJoin(); // (re)announce ourselves after every reconnect
    });

    relay.subscribe('state', s => {
      if (!isNewerState(s, state)) return;
      const changed = !state || s.activity !== state.activity || s.phase !== state.phase
        || s.round !== state.round || s.epoch !== state.epoch;
      state = s;
      if (changed) render();
    });

    // Acknowledgements for this player only.
    relay.subscribe('p/' + playerId, msg => {
      if (msg.type === 'welcome') {
        // The server remembers our answer (e.g. after a reload or on another tab).
        if (msg.answer && state && msg.round === state.round) {
          storage.set(answerKey(msg.round), msg.answer);
          if (state.phase === 'open') { markSelected(msg.answer); setNote(SAVED_NOTE, 'ok'); }
        }
        return;
      }
      if (!pending || msg.round !== pending.round || msg.answer !== pending.answer) return;
      clearTimeout(pending.timer);
      pending = null;
      if (msg.type === 'ack') {
        setNote(SAVED_NOTE, 'ok');
      } else {
        storage.remove(answerKey(msg.round));
        markSelected(null);
        setNote(msg.error || 'Could not save your answer.', 'error');
      }
    });

    // ---------- name ----------

    function setName(value) {
      name = value;
      storage.set('name', name);
      sendJoin();
    }

    function sendJoin() {
      relay.publish('in', { type: 'join', id: playerId, name });
    }
    setInterval(() => { if (name) sendJoin(); }, 20000); // presence, so a restarted screen re-learns everyone

    // The game asks for a name before the first question (or to change it).
    let renaming = false;

    function showJoin(activity) {
      $('main').hidden = true;
      $('join').hidden = false;
      $('join-eyebrow').textContent = activity.title;
      $('name-input').value = name || '';
      $('name-input').focus();
    }

    $('join-form').addEventListener('submit', e => {
      e.preventDefault();
      const value = cleanText($('name-input').value);
      if (!value) return;
      setName(value);
      renaming = false;
      render();
    });

    $('rename').addEventListener('click', () => { renaming = true; render(); });

    // ---------- answering (game) ----------

    const answerKey = round => 'answer:' + round + ':' + (state && state.question ? state.question.id : '');
    let pending = null; // {round, answer, tries, timer}: waiting for the screen to acknowledge

    function choose(answer) {
      const round = state.round;
      storage.set(answerKey(round), answer);
      markSelected(answer);
      if (pending) clearTimeout(pending.timer);
      pending = { round, answer, tries: 0 };
      sendAnswer();
    }

    function sendAnswer() {
      if (!pending) return;
      if (pending.tries >= 6) {
        setNote('The main screen is not responding. Please choose again.', 'error');
        pending = null;
        return;
      }
      pending.tries++;
      setNote('Saving…');
      relay.publish('in', { type: 'answer', id: playerId, name, round: pending.round, answer: pending.answer });
      pending.timer = setTimeout(sendAnswer, 2500);
    }

    function markSelected(answer) {
      view.querySelectorAll('.option').forEach(b => {
        b.classList.toggle('selected', b.dataset.value === answer);
        b.setAttribute('aria-pressed', b.dataset.value === answer ? 'true' : 'false');
      });
    }

    function setNote(text, kind) {
      const note = view.querySelector('.note');
      if (!note) return;
      note.textContent = text;
      note.className = 'note' + (kind ? ' ' + kind : '');
    }

    // ---------- link submission ----------

    const submittedKey = activity => 'submitted:' + activity.id;

    async function submitLink(activity, form) {
      const nameValue = cleanText(form.elements.person.value);
      const link = form.elements.link.value.trim();
      if (!nameValue) return setNote('Please enter your name.', 'error');
      if (!/^https?:\/\/\S+$/i.test(link)) return setNote('Please paste a full link (starting with https://).', 'error');

      const button = form.querySelector('button');
      button.disabled = true;
      setNote('Saving…');
      try {
        await api('submit', { sheet: activity.sheet, name: nameValue, link, playerId });
        if (nameValue !== name) setName(nameValue);
        storage.set(submittedKey(activity), link);
        relay.publish('in', { type: 'submitted', activity: activity.id, id: playerId, name: nameValue });
        button.textContent = 'Update link';
        setNote('Saved ✓ You can update it at any time.', 'ok');
      } catch (err) {
        setNote('Could not save: ' + err.message, 'error');
      } finally {
        button.disabled = false;
      }
    }

    function renderSubmit(activity) {
      const previous = storage.get(submittedKey(activity));
      const group = activity.mode === 'group';
      const form = el('form', { class: 'submit-form', novalidate: true },
        el('label', {}, 'Your name',
          el('input', { type: 'text', name: 'person', dir: 'auto', maxlength: 40, autocomplete: 'name', value: name || '' })),
        el('label', {}, group ? "Link to your group's Google Doc" : 'Link to your Google Doc',
          el('input', {
            type: 'url', name: 'link', dir: 'ltr', inputmode: 'url', autocomplete: 'off',
            placeholder: 'https://docs.google.com/…', value: previous || '',
          })),
        el('button', { class: 'primary big', type: 'submit' }, previous ? 'Update link' : 'Save link'));
      form.addEventListener('submit', e => { e.preventDefault(); submitLink(activity, form); });
      show(
        el('div', { class: 'eyebrow' }, group ? 'Group submission' : 'Personal submission'),
        el('h2', { class: 'q-title', dir: 'auto' }, activity.title),
        activity.instructions ? el('p', { class: 'explanation', dir: 'auto' }, activity.instructions) : null,
        form,
        el('div', { class: 'note' + (previous ? ' ok' : '') },
          previous ? 'Saved ✓ You can update it at any time.' : ''));
    }

    // ---------- rendering ----------

    function show(...children) {
      setChildren(view, ...children);
      view.classList.remove('enter');
      void view.offsetWidth; // restart the entrance animation
      view.classList.add('enter');
    }

    function render() {
      const s = state;
      const activity = s ? activityById(s.activity) : null;
      const inGame = !!activity && activity.type === 'game';
      if (pending && (!inGame || s.phase !== 'open' || s.round !== pending.round)) {
        clearTimeout(pending.timer);
        pending = null;
      }

      if (inGame && (!name || renaming)) {
        document.body.classList.remove('is-welcome');
        return showJoin(activity);
      }
      $('join').hidden = true;
      $('main').hidden = false;
      $('me').textContent = name || '';
      $('who').hidden = !inGame;

      document.body.classList.toggle('is-welcome', !activity);
      if (!activity) {
        return show(el('div', { class: 'center' },
          el('img', { class: 'logo-lg', src: 'assets/logo.svg', alt: 'Reichart Group Retreat' }),
          el('h2', { class: 'q-title' }, WELCOME.title),
          WELCOME.subtitle ? el('p', { class: 'muted' }, WELCOME.subtitle) : null));
      }

      if (activity.type === 'lecture') {
        return show(
          el('div', { class: 'eyebrow' }, activity.name),
          el('h2', { class: 'q-title', dir: 'auto', style: 'margin:0' }, activity.title));
      }

      if (activity.type === 'submit') return renderSubmit(activity);

      // The game
      if (s.phase === 'open' && s.question) return renderQuestion(s);

      if (s.phase === 'results' && s.question) {
        const mine = storage.get(answerKey(s.round));
        show(
          el('div', { class: 'counter' }, questionCounter(s)),
          el('h2', { class: 'q-title', dir: 'auto' }, s.question.text),
          el('div', { class: 'center', style: 'margin-top:26px' },
            el('div', { class: 'icon-badge' }, icon('chat')),
            el('p', {}, 'Responses are closed. The results are on the big screen.'),
            el('p', { class: 'muted' }, mine ? ['You answered: ', el('bdi', {}, mine)] : 'You did not answer this one.')));
        return;
      }

      if (s.phase === 'end') {
        show(el('div', { class: 'center' },
          el('div', { class: 'breath still' }),
          el('h2', {}, 'Thanks for taking part!')));
        return;
      }

      show(el('div', { class: 'center' },
        el('div', { class: 'breath' }),
        el('h2', {}, 'Hi ', el('bdi', {}, name)),
        el('p', { class: 'muted' }, el('span', { class: 'dots' }, 'Waiting for the next question'))));
    }

    function renderQuestion(s) {
      const q = s.question;
      const selected = storage.get(answerKey(s.round));
      const layout = q.type === 'scale' ? 'scale' : (q.options.length === 2 ? 'two' : '');
      show(
        el('div', { class: 'counter' }, questionCounter(s)),
        el('h2', { class: 'q-title', dir: 'auto' }, q.text),
        q.explanation ? el('p', { class: 'explanation', dir: 'auto' }, q.explanation) : null,
        el('div', { class: 'options ' + layout, role: 'group' },
          q.options.map(opt => el('button', {
            type: 'button',
            class: 'option' + (opt === selected ? ' selected' : ''),
            'data-value': opt,
            dir: 'auto',
            'aria-pressed': opt === selected ? 'true' : 'false',
            onclick: () => choose(opt),
          }, el('span', { class: 'tick' }, icon('check', 18)), opt))),
        el('div', { class: 'note' + (selected ? ' ok' : '') }, selected ? SAVED_NOTE : 'Choose the answer closest to your view.'));
    }

    // ---------- start ----------

    if (name) sendJoin();
    render();
  </script>
</body>
</html>
